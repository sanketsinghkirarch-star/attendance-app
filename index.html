<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS & Photo Attendance Portal</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent: #48cae4;
            --success: #06d6a0;
            --danger: #ef476f;
            --text-light: #edf2f4;
            --text-muted: #8d99ae;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 620px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid #3a506b;
        }

        h2 { margin: 0 0 6px 0; text-align: center; color: var(--accent); }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 0; margin-bottom: 20px; }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 2px solid #3a506b;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            background: #0b132b;
            border: 1px solid #3a506b;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        button {
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-in { background: var(--success); color: #0b132b; }
        .btn-out { background: var(--danger); color: white; }

        .status-banner {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            background: #0b132b;
            border: 1px solid #3a506b;
            margin-bottom: 16px;
        }

        .log-box {
            background: #0b132b;
            padding: 12px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid #3a506b;
        }

        .log-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #1c2541;
        }

        .log-item img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--accent);
            cursor: pointer;
        }

        .log-info { flex: 1; }

        .export-btn {
            width: 100%;
            margin-top: 10px;
            background: #3a506b;
            color: white;
            padding: 10px;
            font-size: 13px;
        }

        .admin-box {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #3a506b;
            font-size: 12px;
            color: var(--text-muted);
        }

        .admin-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 8px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Attendance Portal</h2>
    <p class="subtitle">Live GPS Geofencing & Photo Verification System</p>

    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="snapshot-canvas"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="employee-id" placeholder="Enter Full Name / Employee ID">
    </div>

    <div class="btn-grid">
        <button class="btn-in" onclick="processClock('CLOCK IN')">Clock IN</button>
        <button class="btn-out" onclick="processClock('CLOCK OUT')">Clock OUT</button>
    </div>

    <div id="status-display" class="status-banner">Initializing camera and GPS...</div>

    <div class="log-box" id="attendance-log">
        <strong>Activity Logs with Photos:</strong><br>
    </div>
    <button class="export-btn" onclick="exportLogsCSV()">📥 Download Attendance Report (CSV)</button>

    <div class="admin-box">
        <strong>Office Target Coordinates (Geofence)</strong>
        <div class="admin-controls">
            <input type="number" step="any" id="admin-lat" placeholder="Latitude" value="28.3890071">
            <input type="number" step="any" id="admin-lng" placeholder="Longitude" value="76.7000993">
            <input type="number" id="admin-radius" placeholder="Radius (m)" value="100">
            <button onclick="saveAdminGeofence()" style="padding: 8px; background: #3a506b; color: white;">Save</button>
        </div>
        <p id="location-telemetry" style="margin-top: 8px; margin-bottom: 0;"></p>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('snapshot-canvas');
    const ctx = canvas.getContext('2d');
    const statusDisplay = document.getElementById('status-display');
    const telemetry = document.getElementById('location-telemetry');
    const logBox = document.getElementById('attendance-log');

    let currentCoordinates = null;
    let attendanceRecords = JSON.parse(localStorage.getItem('portal_attendance_records_v2') || '[]');

    let adminConfig = JSON.parse(localStorage.getItem('portal_admin_config') || JSON.stringify({
        lat: -76.7000993,
        lng: -28.3890071,
        radius: 100
    }));

    async function initSystem() {
        document.getElementById('admin-lat').value = adminConfig.lat;
        document.getElementById('admin-lng').value = adminConfig.lng;
        document.getElementById('admin-radius').value = adminConfig.radius;

        renderSavedLogs();

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            updateStatus("System Ready. Enter Employee Name and click Clock IN/OUT.", "var(--success)");
        } catch (err) {
            updateStatus("Camera Access Error: " + err.message + ". Allow camera access in browser.", "var(--danger)");
        }

        trackGPS();
    }

    function trackGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    currentCoordinates = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    const distance = computeHaversine(
                        currentCoordinates.lat, currentCoordinates.lng,
                        adminConfig.lat, adminConfig.lng
                    );
                    telemetry.innerText = `GPS: (${currentCoordinates.lat.toFixed(4)}, ${currentCoordinates.lng.toFixed(4)}) | Distance to Office: ${Math.round(distance)}m`;
                },
                (err) => { telemetry.innerText = "GPS Error: " + err.message + " (Enable Location)"; },
                { enableHighAccuracy: true }
            );
        }
    }

    function computeHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const rad = Math.PI / 180;
        const dLat = (lat2 - lat1) * rad;
        const dLon = (lon2 - lon1) * rad;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function capturePhoto() {
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.5);
    }

    function processClock(actionType) {
        const empName = document.getElementById('employee-id').value.trim();

        if (!empName) {
            alert("Please enter Employee Name / ID first!");
            return;
        }

        if (!currentCoordinates) {
            updateStatus("GPS Error: Acquiring location, please wait...", "var(--danger)");
            return;
        }

        const distance = computeHaversine(currentCoordinates.lat, currentCoordinates.lng, adminConfig.lat, adminConfig.lng);
        
        if (distance > adminConfig.radius) {
            updateStatus(`ACCESS DENIED: You are ${Math.round(distance)}m from office (Max allowed: ${adminConfig.radius}m)`, "var(--danger)");
            return;
        }

        const photoData = capturePhoto();

        const record = {
            date: new Date().toLocaleDateString(),
            time: new Date().toLocaleTimeString(),
            action: actionType,
            name: empName,
            distance: `${Math.round(distance)}m`,
            lat: currentCoordinates.lat,
            lng: currentCoordinates.lng,
            photo: photoData
        };

        attendanceRecords.push(record);
        if (attendanceRecords.length > 30) attendanceRecords.shift();

        localStorage.setItem('portal_attendance_records_v2', JSON.stringify(attendanceRecords));

        renderSavedLogs();
        updateStatus(`SUCCESS: ${actionType} recorded with Photo for '${empName}' at ${record.time}`, "var(--success)");
    }

    function renderSavedLogs() {
        logBox.innerHTML = '<strong>Activity Logs with Photos:</strong>';
        if (attendanceRecords.length === 0) {
            logBox.innerHTML += '<p style="margin: 8px 0;">No attendance records yet.</p>';
            return;
        }

        attendanceRecords.slice().reverse().forEach(r => {
            const item = document.createElement('div');
            item.className = 'log-item';
            
            const img = document.createElement('img');
            img.src = r.photo;
            img.alt = r.name;
            img.title = 'Click to view full photo';
            img.onclick = () => {
                const w = window.open("");
                w.document.write(`<img src="${r.photo}" style="max-width:100%; border-radius:8px;" /><br><h3>${r.name} - ${r.action} (${r.date} ${r.time})</h3>`);
            };

            const info = document.createElement('div');
            info.className = 'log-info';
            info.innerHTML = `<strong>${r.name}</strong> (${r.action})<br><span style="color:var(--accent);">${r.date} ${r.time}</span> • ${r.distance} from office`;

            item.appendChild(img);
            item.appendChild(info);
            logBox.appendChild(item);
        });
    }

    function exportLogsCSV() {
        if (attendanceRecords.length === 0) {
            alert("No attendance records to export!");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,Date,Time,Action,Employee Name,Distance to Office,Latitude,Longitude\n";
        attendanceRecords.forEach(r => {
            csvContent += `"${r.date}","${r.time}","${r.action}","${r.name}","${r.distance}","${r.lat}","${r.lng}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `attendance_report_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function updateStatus(text, color) {
        statusDisplay.innerText = text;
        statusDisplay.style.borderColor = color;
        statusDisplay.style.color = color;
    }

    function saveAdminGeofence() {
        adminConfig = {
            lat: parseFloat(document.getElementById('admin-lat').value),
            lng: parseFloat(document.getElementById('admin-lng').value),
            radius: parseFloat(document.getElementById('admin-radius').value)
        };
        localStorage.setItem('portal_admin_config', JSON.stringify(adminConfig));
        alert("Geofence settings updated successfully!");
    }

    window.onload = initSystem;
</script>
</body>
</html>
